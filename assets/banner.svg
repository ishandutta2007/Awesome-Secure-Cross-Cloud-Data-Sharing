<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#081026"/>
    </linearGradient>

    <!-- Cloud Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    /* Dynamic pulsing and flowing animations behind text */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(12px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(18px) translateX(-15px); }
    }
    @keyframes packetFlow1 {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .flow-line {
      stroke-dasharray: 8, 12;
      animation: dashMove 3s linear infinite;
    }
    .pulse-node {
      transform-origin: center;
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .orb-1 {
      animation: floatOrb1 7s ease-in-out infinite;
    }
    .orb-2 {
      animation: floatOrb2 8s ease-in-out infinite;
    }
    .badge-pill {
      backdrop-filter: blur(8px);
      transition: all 0.3s;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <g class="orb-1">
    <circle cx="200" cy="90" r="130" fill="#0284c7" opacity="0.12" filter="url(#glow)"/>
    <circle cx="1020" cy="110" r="140" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>
  </g>
  <g class="orb-2">
    <circle cx="600" cy="270" r="160" fill="#0d9488" opacity="0.1" filter="url(#glow)"/>
  </g>

  <!-- Grid Pattern Overlay in Background -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Animated Cross-Cloud Data Flow Lines (Background Layer) -->
  <g fill="none">
    <!-- AWS to Central Hub -->
    <path class="flow-line" d="M 120 70 C 260 40, 400 90, 600 90" stroke="#38bdf8" stroke-width="2.5" opacity="0.65"/>
    <!-- Azure to Central Hub -->
    <path class="flow-line" d="M 1080 70 C 940 40, 800 90, 600 90" stroke="#a855f7" stroke-width="2.5" opacity="0.65"/>
    <!-- GCP to Central Hub -->
    <path class="flow-line" d="M 600 310 C 600 240, 600 160, 600 90" stroke="#34d399" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Background Pulsing Anchor Rings -->
  <circle cx="600" cy="90" r="32" class="pulse-node" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <circle cx="600" cy="90" r="48" class="pulse-node" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.2"/>

  <!-- Cloud Node Badges (Left, Right, Bottom) -->
  <g transform="translate(60, 48)">
    <rect width="110" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="55" y="26" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="600">☁️ AWS S3</text>
  </g>

  <g transform="translate(1030, 48)">
    <rect width="110" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" opacity="0.9" />
    <text x="55" y="26" text-anchor="middle" fill="#d8b4fe" font-size="13" font-weight="600">⚡ Azure ADLS</text>
  </g>

  <!-- Foreground Shield / Center Icon -->
  <g transform="translate(585, 75)">
    <circle cx="15" cy="15" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <path d="M 15 5 L 25 10 L 25 19 C 25 25, 15 29, 15 29 C 15 29, 5 25, 5 19 L 5 10 Z" fill="#0284c7" stroke="#e0f2fe" stroke-width="1.5"/>
  </g>

  <!-- FOREGROUND TEXT CONTENT: Guaranteed High Contrast & Readability -->
  <g id="foreground-content">
    <!-- Top Micro Tagline -->
    <text x="600" y="150" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="3.5">
      ZERO-COPY • FEDERATED GOVERNANCE • MULTI-CLOUD
    </text>

    <!-- Main Title -->
    <text x="600" y="200" text-anchor="middle" fill="#ffffff" font-size="38" font-weight="800" letter-spacing="-0.5">
      Secure Cross-Cloud Data Sharing
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="400">
      Curated Production Stack: SaaS Marketplaces, Open Protocols (Delta Sharing) &amp; Privacy-Preserving Clean Rooms
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(230, 268)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="4.5" fill="#38bdf8"/>
        <text x="92" y="22" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">Delta Sharing</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="4.5" fill="#a855f7"/>
        <text x="100" y="22" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">Apache Iceberg</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(380, 0)">
        <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="4.5" fill="#34d399"/>
        <text x="96" y="22" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">Data Clean Rooms</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(570, 0)">
        <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <circle cx="20" cy="17" r="4.5" fill="#f59e0b"/>
        <text x="96" y="22" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">Sovereign Spaces</text>
      </g>
    </g>
  </g>
</svg>
